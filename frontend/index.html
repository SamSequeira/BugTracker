                            <td className="py-3 px-3 font-mono text-slate-300">{bug.id}</td>
                            <td className="py-3 px-3 font-medium text-white">{bug.title}</td>
                            <td className="py-3 px-3">
                              <span
                                className={`px-2 py-0.5 rounded text-[11px] border font-medium ${
                                  bug.severity === "Critical"
                                    ? "bg-red-500/10 text-red-400 border-red-500/30"
                                    : bug.severity === "High"
                                    ? "bg-amber-500/10 text-amber-400 border-amber-500/30"
                                    : "bg-yellow-500/10 text-yellow-400 border-yellow-500/30"
                                }`}
                              >
                                {bug.severity}
                              </span>
                            </td>
                            <td className="py-3 px-3">
                              <span
                                className={`text-[11px] font-medium ${
                                  bug.priority.includes("P1")
                                    ? "text-red-400"
                                    : bug.priority.includes("P2")
                                    ? "text-amber-400"
                                    : "text-yellow-400"
                                }`}
                              >
                                {bug.priority}
                              </span>
                            </td>
                            <td className="py-3 px-3 font-mono text-slate-400">{bug.file}</td>
                            <td className="py-3 px-3">
                              <span
                                className={`px-2 py-0.5 rounded text-[10px] border font-medium ${
                                  bug.status === "Open"
                                    ? "border-emerald-500/30 text-emerald-400 bg-emerald-500/10"
                                    : "border-blue-500/30 text-blue-400 bg-blue-500/10"
                                }`}
                              >
                                {bug.status}
                              </span>
                            </td>
                            <td className="py-3 px-3 text-slate-400 flex items-center justify-between">
                              <span className="flex items-center gap-1">
                                <i data-lucide="users" className="w-3 h-3"></i> {bug.similar}
                              </span>
                              <i data-lucide={expandedBug === bug.id ? "chevron-up" : "chevron-down"} className="w-4 h-4"></i>
                            </td>
                          </tr>

                          {/* Expanded Code View */}
                          {expandedBug === bug.id && (
                            <tr>
                              <td colSpan={8} className="p-4 bg-[#0B0F17] border-t border-slate-800">
                                <div className="space-y-4">
                                  <div className="flex items-center justify-between flex-wrap gap-2">
                                    <div className="flex items-center space-x-2">
                                      <i data-lucide="alert-circle" className="w-4 h-4 text-red-400"></i>
                                      <h4 className="font-semibold text-white">{bug.title}</h4>
                                      <span className="text-slate-500 text-xs">— {bug.file}</span>
                                    </div>
                                    <div className="flex items-center space-x-2 text-xs">
                                      <span className="text-slate-400">Status:</span>
                                      <span className="text-emerald-400 border border-emerald-500/30 bg-emerald-500/10 px-2 py-0.5 rounded">
                                        Open
                                      </span>
                                    </div>
                                  </div>

                                  <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
                                    {/* Code Snippet Box */}
                                    <div className="bg-[#0F1623] border border-slate-800 rounded-lg p-3 font-mono text-[11px] leading-relaxed">
                                      <div className="text-slate-500 mb-2 flex items-center justify-between">
                                        <span>Code snippet</span>
                                        <i data-lucide="copy" className="w-3.5 h-3.5 text-slate-500 cursor-pointer hover:text-slate-300"></i>
                                      </div>
                                      <div className="space-y-1">
                                        <div className="text-slate-600">114  def getUserData(userId):</div>
                                        <div className="text-slate-600">115      conn = getConnectbile()</div>
                                        <div className="text-slate-600">116      cursor = conn.cursor()</div>
                                        <div className="bg-red-500/10 border-l-2 border-red-500 text-red-300 pl-2 py-0.5">
                                          117  query = "SELECT * FROM users WHERE id = " + userId
                                        </div>
                                        <div className="bg-red-500/20 border-l-2 border-red-500 text-red-200 pl-2 py-0.5">
                                          118  results = cursor.fetchall()
                                        </div>
                                        <div className="text-slate-600">119      conn.close()</div>
                                        <div className="text-slate-600">120      return results</div>
                                      </div>
                                    </div>

                                    {/* Explanation & Suggested Fix */}
                                    <div className="space-y-3 text-xs">
                                      <div>
                                        <h5 className="font-semibold text-slate-300 mb-0.5">What's wrong</h5>
                                        <p className="text-slate-400">
                                          User input is being inserted directly into a database query without sanitization. This lets an attacker run their own database commands.
                                        </p>
                                      </div>

                                      <div>
                                        <h5 className="font-semibold text-slate-300 mb-0.5">Why it matters</h5>
                                        <p className="text-slate-400">
                                          An attacker could read, change, or delete data in your database.
                                        </p>
                                      </div>

                                      <div className="bg-[#0F1623] border border-slate-800 rounded-lg p-3">
                                        <h5 className="font-semibold text-slate-200 mb-2 flex items-center justify-between">
                                          <span>Suggested Fix <span className="text-slate-500 font-normal">(click to expand)</span></span>
                                          <i data-lucide="chevron-up" className="w-4 h-4 text-slate-400"></i>
                                        </h5>
                                        <div className="font-mono text-[11px] space-y-1 bg-[#0B0F17] p-2 rounded border border-slate-800">
                                          <div className="text-red-400">- query = "SELECT * FROM users WHERE id = " + userId</div>
                                          <div className="text-emerald-400">+ query = "SELECT * FROM users WHERE id = %s"</div>
                                          <div className="text-emerald-400">+ cursor.execute(query, (userId,))</div>
                                        </div>
                                        <p className="text-[10px] text-slate-500 mt-2">
                                          Use parameterized queries to safely handle user input.
                                        </p>
                                      </div>
                                    </div>
                                  </div>

                                  {/* Action Buttons */}
                                  <div className="flex flex-wrap gap-2 pt-2">
                                    <button className="bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 px-3 py-1.5 rounded text-xs flex items-center gap-1.5">
                                      <i data-lucide="check-circle" className="w-3.5 h-3.5 text-emerald-400"></i> Mark as Resolved
                                    </button>
                                    <button className="bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 px-3 py-1.5 rounded text-xs flex items-center gap-1.5">
                                      <i data-lucide="eye-off" className="w-3.5 h-3.5 text-slate-400"></i> Ignore this issue
                                    </button>
                                    <button className="bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 px-3 py-1.5 rounded text-xs flex items-center gap-1.5">
                                      <i data-lucide="copy" className="w-3.5 h-3.5 text-slate-400"></i> Copy code location
                                    </button>
                                  </div>
                                </div>
                              </td>
                            </tr>
                          )}
                        </React.Fragment>
                      ))}
                    </tbody>
                  </table>
                </div>

                <div className="text-center pt-2">
                  <button className="text-xs text-cyan-400 hover:underline">
                    View all 128 issues &rarr;
                  </button>
                </div>
              </div>

              {/* Accordion Footer Options */}
              <div className="space-y-2">
                <div className="bg-[#131B2E] border border-slate-800 p-3 rounded-lg flex justify-between items-center cursor-pointer hover:bg-slate-800/50">
                  <div className="flex items-center space-x-2">
                    <i data-lucide="clock" className="w-4 h-4 text-slate-400"></i>
                    <span className="text-xs font-semibold text-white">Recently Found Issues</span>
                    <span className="text-[11px] text-slate-500 hidden sm:inline">— Latest problems discovered in this scan</span>
                  </div>
                  <span className="text-xs text-slate-400 flex items-center gap-2">
                    5 new issues <i data-lucide="chevron-down" className="w-4 h-4"></i>
                  </span>
                </div>

                <div className="bg-[#131B2E] border border-slate-800 p-3 rounded-lg flex justify-between items-center cursor-pointer hover:bg-slate-800/50">
                  <div className="flex items-center space-x-2">
                    <i data-lucide="bug" className="w-4 h-4 text-slate-400"></i>
                    <span className="text-xs font-semibold text-white">Repeated / Similar Issues</span>
                    <span className="text-[11px] text-slate-500 hidden sm:inline">— Issues that appear multiple times in your codebase</span>
                  </div>
                  <span className="text-xs text-slate-400 flex items-center gap-2">
                    18 groups <i data-lucide="chevron-down" className="w-4 h-4"></i>
                  </span>
                </div>
              </div>
            </main>

            {/* Footer Bar */}
            <footer className="bg-[#0F1623] border-t border-slate-800 p-4 px-6 flex flex-col md:flex-row items-center justify-between text-xs text-slate-400 space-y-3 md:space-y-0 mt-auto">
              <div className="flex items-center space-x-4 flex-wrap gap-y-2">
                <span className="font-semibold text-white flex items-center gap-1.5">
                  <i data-lucide="code-2" className="w-4 h-4 text-cyan-400"></i> your-repo
                  <span className="bg-slate-800 text-[10px] px-1.5 py-0.5 rounded font-normal text-slate-400 border border-slate-700">
                    Public
                  </span>
                </span>
                <span>Branch: <strong className="text-slate-200">main</strong></span>
                <span>Files scanned: <strong className="text-slate-200">2,843</strong></span>
                <span>Lines of code: <strong className="text-slate-200">128,742</strong></span>
                <span>Last scan: <strong className="text-slate-200">May 21, 2026 10:42 AM</strong></span>
              </div>

              <button onClick={scrollToTop} className="bg-cyan-400 hover:bg-cyan-300 text-slate-950 font-semibold px-4 py-1.5 rounded-md flex items-center gap-1.5 transition-colors text-xs shrink-0">
                Scan another repository &uarr;
              </button>
            </footer>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<BugTrackerDashboard />);
  </script>
</body>
</html>
