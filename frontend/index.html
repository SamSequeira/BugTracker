                        <p className="text-slate-300">Asynchronous microservice platform managing authentication, order checkout, inventory ETL, and websocket alerts.</p>
                      </div>
                      <div className="bg-[#0B0F17] border border-slate-800 p-3.5 rounded-lg space-y-1">
                        <span className="text-slate-500 uppercase font-semibold text-[10px]">Detected Tech Stack</span>
                        <p className="text-cyan-300 font-mono">Python 3.11, FastAPI, PostgreSQL, WebSockets, Docker, AWS S3</p>
                      </div>
                      <div className="bg-[#0B0F17] border border-slate-800 p-3.5 rounded-lg space-y-1">
                        <span className="text-slate-500 uppercase font-semibold text-[10px]">Engineer Health Takeaway</span>
                        <p className="text-slate-300">Architecture is scalable, but critical SQL injection in <code className="text-cyan-400">queryBuilder.py</code> requires immediate fix.</p>
                      </div>
                    </div>
                  </div>

                  {/* PER-FILE SUMMARIES */}
                  <div className="space-y-3">
                    <h3 className="font-semibold text-white text-sm">Per-File Functional Summaries (6 files scanned)</h3>
                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
                      {fileSummaries.map((f, idx) => (
                        <div key={idx} className="bg-[#131B2E] border border-slate-800 rounded-xl p-4 space-y-2.5">
                          <div className="flex justify-between items-center">
                            <span className="font-mono text-xs font-bold text-white flex items-center gap-1.5">
                              <i data-lucide="file-code" className="w-4 h-4 text-cyan-400"></i> {f.filename}
                            </span>
                            <span className={`text-[10px] px-2 py-0.5 rounded border font-medium ${f.statusColor}`}>{f.status}</span>
                          </div>
                          <p className="text-xs text-slate-300">{f.role}</p>
                          <div className="bg-[#0B0F17] border border-slate-800 p-2 rounded text-[11px] text-slate-400">
                            <strong className="text-slate-300">Intent: </strong> {f.intent}
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>
              )}

              {/* ========================================== */}
              {/* TAB 3: DEBUGGING VIEW (Grouped by File)   */}
              {/* ========================================== */}
              {activeTab === "debugging" && (
                <div className="space-y-6">
                  <div className="border-b border-slate-800 pb-3">
                    <h2 className="text-xl font-bold text-white flex items-center gap-2">
                      <i data-lucide="bug" className="w-5 h-5 text-red-400"></i> Debugging & Issue Inspector
                    </h2>
                    <p className="text-xs text-slate-400 mt-0.5">Issues grouped by file name with exact line numbers, code snippets, and fix diffs.</p>
                  </div>

                  <div className="space-y-6">
                    {Object.entries(bugsByFile).map(([file, fileBugs]) => (
                      <div key={file} className="bg-[#131B2E] border border-slate-800 rounded-xl overflow-hidden">
                        {/* Group Header */}
                        <div className="bg-[#0F1623] px-5 py-3 border-b border-slate-800 flex items-center justify-between">
                          <div className="flex items-center space-x-2">
                            <i data-lucide="file-code" className="w-4 h-4 text-cyan-400"></i>
                            <span className="font-mono text-xs sm:text-sm font-bold text-white">{file}</span>
                            <span className="text-[11px] text-slate-500">({fileBugs.length} issue)</span>
                          </div>
                        </div>

                        {/* File Issues */}
                        <div className="p-4 space-y-4">
                          {fileBugs.map((bug) => {
                            const isExpanded = expandedBug === bug.id;
                            const isResolved = bug.status === "Resolved";

                            return (
                              <div key={bug.id} className="space-y-3">
                                <div
                                  onClick={() => setExpandedBug(isExpanded ? null : bug.id)}
                                  className="flex items-center justify-between cursor-pointer hover:bg-slate-800/40 p-2 rounded-lg"
                                >
                                  <div className="flex items-center space-x-3">
                                    <span className="font-mono text-xs text-slate-400">{bug.id}</span>
                                    <h4 className={`text-xs font-semibold ${isResolved ? "line-through text-slate-500" : "text-white"}`}>
                                      {bug.title}
                                    </h4>
                                    <span className="text-xs text-slate-500 font-mono">Line {bug.line}</span>
                                  </div>
                                  <div className="flex items-center space-x-2">
                                    <span className="text-red-400 bg-red-500/10 border border-red-500/30 px-2 py-0.5 rounded text-[10px]">
                                      {bug.severity}
                                    </span>
                                    <span className={`text-[10px] px-2 py-0.5 rounded border ${isResolved ? "text-emerald-400 border-emerald-500/30" : "text-blue-400 border-blue-500/30"}`}>
                                      {isResolved ? "Resolved" : bug.status}
                                    </span>
                                  </div>
                                </div>

                                {isExpanded && (
                                  <div className="p-4 bg-[#0B0F17] rounded-lg border border-slate-800 space-y-4">
                                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
                                      {/* Code snippet */}
                                      <div className="bg-[#0F1623] border border-slate-800 rounded p-3 font-mono text-[11px]">
                                        <span className="text-slate-500 text-[10px] block mb-2">// Code snippet ({bug.file}:{bug.line})</span>
                                        {bug.codeSnippet.map((l) => (
                                          <div key={l.num} className={l.err ? "bg-red-500/20 text-red-300 pl-2" : "text-slate-500 pl-2"}>
                                            <span className="inline-block w-8 text-slate-600">{l.num}</span> {l.code}
                                          </div>
                                        ))}
                                      </div>

                                      {/* Explanation & Diff */}
                                      <div className="space-y-3 text-xs">
                                        <div>
                                          <h5 className="font-semibold text-slate-300">What's wrong</h5>
                                          <p className="text-slate-400">{bug.wrong}</p>
                                        </div>
                                        <div className="bg-[#0F1623] border border-slate-800 p-2.5 rounded">
                                          <h5 className="font-semibold text-slate-200 mb-1">Suggested Fix</h5>
                                          <div className="font-mono text-[11px] bg-[#0B0F17] p-2 rounded">
                                            <div className="text-red-400">{bug.fixDiff.remove}</div>
                                            <div className="text-emerald-400">{bug.fixDiff.add1}</div>
                                          </div>
                                        </div>
                                      </div>
                                    </div>

                                    <button
                                      onClick={() => toggleResolveBug(bug.id)}
                                      className={`px-3 py-1.5 rounded text-xs font-semibold ${isResolved ? "bg-emerald-600 text-white" : "bg-slate-800 hover:bg-slate-700 text-slate-200"}`}
                                    >
                                      {isResolved ? "✓ Marked as Resolved" : "Mark as Resolved"}
                                    </button>
                                  </div>
                                )}
                              </div>
                            );
                          })}
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {/* ========================================== */}
              {/* TAB 4: CONSOLIDATED AUDIT REPORT          */}
              {/* ========================================== */}
              {activeTab === "report" && (
                <div className="space-y-6">
                  <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                    <div>
                      <h2 className="text-xl font-bold text-white flex items-center gap-2">
                        <i data-lucide="file-text" className="w-5 h-5 text-cyan-400"></i> Code Vulnerability & Resolution Audit Report
                      </h2>
                      <p className="text-xs text-slate-400 mt-0.5">Line-by-line breakdown of every issue and its fix status.</p>
                    </div>
                    <button
                      onClick={() => window.print()}
                      className="bg-cyan-400 hover:bg-cyan-300 text-slate-950 font-bold px-4 py-2 rounded-lg text-xs flex items-center gap-2"
                    >
                      <i data-lucide="download" className="w-4 h-4"></i> Download Report (PDF)
                    </button>
                  </div>

                  {/* Summary Registry Table */}
                  <div className="bg-[#131B2E] border border-slate-800 rounded-xl overflow-hidden">
                    <table className="w-full text-left text-xs min-w-[700px]">
                      <thead>
                        <tr className="border-b border-slate-800 text-slate-400 bg-[#0F1623]">
                          <th className="py-3 px-4 w-12">#</th>
                          <th className="py-3 px-4 w-48">File Path</th>
                          <th className="py-3 px-4 w-20">Line</th>
                          <th className="py-3 px-4">Issue Description</th>
                          <th className="py-3 px-4 w-24">Severity</th>
                          <th className="py-3 px-4 w-32">Fix Status</th>
                          <th className="py-3 px-4 w-28 text-right">Toggle Fix</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-800/50">
                        {bugs.map((bug, idx) => {
                          const isResolved = bug.status === "Resolved";
                          return (
                            <tr key={bug.id} className="hover:bg-slate-800/30">
                              <td className="py-3 px-4 text-slate-500">{idx + 1}</td>
                              <td className="py-3 px-4 font-mono text-cyan-300">{bug.file}</td>
                              <td className="py-3 px-4 font-mono text-slate-300">:{bug.line}</td>
                              <td className="py-3 px-4 text-white">{bug.title}</td>
                              <td className="py-3 px-4 text-red-400">{bug.severity}</td>
                              <td className="py-3 px-4">
                                <span className={`px-2 py-0.5 rounded text-[10px] font-semibold ${isResolved ? "bg-emerald-500/20 text-emerald-300" : "bg-red-500/10 text-red-400"}`}>
                                  {isResolved ? "Fixed / Resolved" : "Not Fixed (Open)"}
                                </span>
                              </td>
                              <td className="py-3 px-4 text-right">
                                <button
                                  onClick={() => toggleResolveBug(bug.id)}
                                  className="text-[11px] text-cyan-400 hover:underline"
                                >
                                  {isResolved ? "Reopen" : "Mark Fixed"}
                                </button>
                              </td>
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>
                  </div>
                </div>
              )}

            </main>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<BugTrackerApp />);
  </script>
</body>
</html>
